yawl: "0.1"
start: selectOverdueTickets

steps:
  # 1. Запрос к YDB: выбираем тикеты старше 24 часов, которые ещё не закрыты.
  # 'answered' тоже считаем зависшим: агент ответил, но это не значит,
  # что вопрос закрыт — пользователь мог не получить помощь по существу.
  selectOverdueTickets:
    databaseQuery:
      # ВАЖНО: при деплое в другой каталог/базу заменить database на свой путь
      # (YaWL не поддерживает переменные окружения — только Lockbox/jq по state).
      connection:
        type: YDB
        host: ydb.serverless.yandexcloud.net
        port: 2135
        database: /ru-central1/b1guflsc731o3ndn2nkj/etne19ghdce1rb457cak  # <- заменить на свой YDB_DATABASE
        ssl: true
        iam: true
      query: >
        SELECT id, user_id, category, text, created_at 
        FROM tickets 
        WHERE status IN ('open', 'answered') 
          AND created_at < (CurrentUtcTimestamp() - Interval('PT24H'));
      mode: QUERY
      output: '\({"tickets": (.ResultSets[0] // []), "count": ((.ResultSets[0] // []) | length)})'
      retryPolicy:
        errorList:
          - STEP_TIMEOUT
          - YDB_CALL_SERVICE_UNAVAILABLE
        retryCount: 3
        initialDelay: 2s
        backoffRate: 2.0
      next: checkTickets

  # 2. Переключатель: если тикетов нет — выходим, если есть — идём дальше
  checkTickets:
    switch:
      choices:
        - condition: '\( .count > 0 )'
          next: escalateTickets
        - condition: "true"
          next: noActionNeeded

  # 3. Статус → escalated. Дайджест для оператора собираем сами из .tickets
  # (без Help Desk агента: у него file_search / list-my-tickets и другой промпт).
  escalateTickets:
    databaseQuery:
      connection:
        type: YDB
        host: ydb.serverless.yandexcloud.net
        port: 2135
        database: /ru-central1/b1guflsc731o3ndn2nkj/etne19ghdce1rb457cak  # <- заменить на свой YDB_DATABASE
        ssl: true
        iam: true
      query: >
        UPDATE tickets 
        SET status = 'escalated', updated_at = CurrentUtcTimestamp()
        WHERE status IN ('open', 'answered') 
          AND created_at < (CurrentUtcTimestamp() - Interval('PT24H'));
      mode: QUERY
      output: '\({})'
      retryPolicy:
        errorList:
          - STEP_TIMEOUT
          - YDB_CALL_SERVICE_UNAVAILABLE
        retryCount: 3
        initialDelay: 2s
        backoffRate: 2.0
      next: sendEmail

  # 4. Письмо оператору: структурированный дайджест из выборки YDB (jq), не LLM.
  sendEmail:
    httpCall:
      url: "https://functions.yandexcloud.net/d4e58dg5b5hlls5tv8g7"  # <- заменить на http_invoke_url своей CF email-sender
      method: POST
      headers:
        Content-Type: "application/json"
      body: |-
        \({
          "to": "ibitsa7@yandex.ru",
          "subject": "Дайджест просроченных тикетов",
          "body": (
            "Просроченные тикеты: \(.count)\n\n" +
            (
              [.tickets[] |
                "- id: \(.id // .Id // "?")\n  user: \(.user_id // .UserId // "?")\n  category: \(.category // .Category // "?")\n  created: \(.created_at // .CreatedAt // "?")\n  text: \((.text // .Text // "") | tostring | .[0:240])"
              ] | join("\n\n")
            )
          )
        } | tojson)
      retryPolicy:
        errorList:
          - STEP_TIMEOUT
          - HTTP_CALL_500
          - HTTP_CALL_502
          - HTTP_CALL_503
          - HTTP_CALL_504
          - HTTP_CALL_429
        retryCount: 3
        initialDelay: 2s
        backoffRate: 2.0
      next: done

  # Терминальные шаги
  noActionNeeded:
    success: {}

  done:
    success: {}
