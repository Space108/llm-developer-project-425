yawl: "0.1"
start: selectOverdueTickets

steps:
  # 1. Запрос к YDB: выбираем открытые тикеты старше 24 часов
  selectOverdueTickets:
    databaseQuery:
      connection:
        type: YDB
        host: ydb.serverless.yandexcloud.net
        port: 2135
        database: /ru-central1/b1guflsc731o3ndn2nkj/etne19ghdce1rb457cak
        ssl: true
        iam: true
      query: >
        SELECT id, user_id, category, text, created_at 
        FROM tickets 
        WHERE status = 'open' 
          AND created_at < (CurrentUtcTimestamp() - Interval('PT24H'));
      mode: QUERY
      output: '\({"tickets": (.ResultSets[0] // []), "count": ((.ResultSets[0] // []) | length)})'
      retryPolicy:
        errorList:
          - STEP_TIMEOUT
          - YDB_CALL_SERVICE_UNAVAILABLE
        retryCount: 3
        initialDelay: 2s
        backoffRate: 2.0
      next: checkTickets

  # 2. Переключатель: если тикетов нет — выходим, если есть — идём дальше
  checkTickets:
    switch:
      choices:
        - condition: '\( .count > 0 )'
          next: generateDigest
        - condition: "true"
          next: noActionNeeded

  # 3. Вызов агента из Agent Atelier для генерации дайджеста
  generateDigest:
    aiStudioAgent:
      promptTemplateId: "fvt299r9451u2cn3m9r7"
      message: 'Сформируй краткий и структурированный дайджест для оператора техподдержки по следующим просроченным тикетам: \(.tickets // .selectOverdueTickets.tickets)'
      auto_approve: true
      retryPolicy:
        errorList:
          - STEP_TIMEOUT
          - HTTP_CALL_500
          - HTTP_CALL_502
          - HTTP_CALL_503
          - HTTP_CALL_504
        retryCount: 3
        initialDelay: 2s
        backoffRate: 2.0
      next: escalateTickets

  # 4. Запрос к YDB: обновляем статус просроченных тикетов на 'escalated'
  escalateTickets:
    databaseQuery:
      connection:
        type: YDB
        host: ydb.serverless.yandexcloud.net
        port: 2135
        database: /ru-central1/b1guflsc731o3ndn2nkj/etne19ghdce1rb457cak
        ssl: true
        iam: true
      query: >
        UPDATE tickets 
        SET status = 'escalated', updated_at = CurrentUtcTimestamp()
        WHERE status = 'open' 
          AND created_at < (CurrentUtcTimestamp() - Interval('PT24H'));
      mode: QUERY
      retryPolicy:
        errorList:
          - STEP_TIMEOUT
          - YDB_CALL_SERVICE_UNAVAILABLE
        retryCount: 3
        initialDelay: 2s
        backoffRate: 2.0
      next: sendEmail

  # 5. Отправка письма оператору через CF email-sender
  sendEmail:
    httpCall:
      url: "https://functions.yandexcloud.net/d4e58dg5b5hlls5tv8g7"
      method: POST
      headers:
        Content-Type: "application/json"
      body: |-
        \({
          "to": "ibitsa7@yandex.ru",
          "subject": "Дайджест просроченных тикетов",
          "body": (.generateDigest.result.message // .generateDigest.result.text // "")
        } | tojson)
      retryPolicy:
        errorList:
          - STEP_TIMEOUT
          - HTTP_CALL_500
          - HTTP_CALL_502
          - HTTP_CALL_503
          - HTTP_CALL_504
          - HTTP_CALL_429
        retryCount: 3
        initialDelay: 2s
        backoffRate: 2.0
      next: done

  # Терминальные шаги
  noActionNeeded:
    success: {}

  done:
    success: {}
