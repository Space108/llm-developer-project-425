yawl: "0.1"
start: selectOverdueTickets

steps:
  # 1. Запрос к YDB: выбираем тикеты старше 24 часов, которые ещё не закрыты.
  # 'answered' тоже считаем зависшим: агент ответил, но это не значит,
  # что вопрос закрыт — пользователь мог не получить помощь по существу.
  selectOverdueTickets:
    databaseQuery:
      # ВАЖНО: при деплое в другой каталог/базу заменить database на свой путь
      # (YaWL не поддерживает переменные окружения — только Lockbox/jq по state).
      connection:
        type: YDB
        host: ydb.serverless.yandexcloud.net
        port: 2135
        database: /ru-central1/b1guflsc731o3ndn2nkj/etne19ghdce1rb457cak  # <- заменить на свой YDB_DATABASE
        ssl: true
        iam: true
      query: >
        SELECT id, user_id, category, text, created_at 
        FROM tickets 
        WHERE status IN ('open', 'answered') 
          AND created_at < (CurrentUtcTimestamp() - Interval('PT24H'));
      mode: QUERY
      output: '\({"tickets": (.ResultSets[0] // []), "count": ((.ResultSets[0] // []) | length)})'
      retryPolicy:
        errorList:
          - STEP_TIMEOUT
          - YDB_CALL_SERVICE_UNAVAILABLE
        retryCount: 3
        initialDelay: 2s
        backoffRate: 2.0
      next: checkTickets

  # 2. Переключатель: если тикетов нет — выходим, если есть — идём дальше
  checkTickets:
    switch:
      choices:
        - condition: '\( .count > 0 )'
          next: generateDigest
        - condition: "true"
          next: noActionNeeded

  # 3. Вызов агента из Agent Atelier для генерации дайджеста.
  # Текст ответа агента лежит в .Result (см. документацию Yandex Workflows
  # по шагу aiStudioAgent) — забираем его сразу явным output в свой ключ
  # "digest", т.к. состояние между шагами сливается по верхнеуровневым
  # ключам, а не вкладывается под имя шага.
  generateDigest:
    aiStudioAgent:
      promptTemplateId: "fvt299r9451u2cn3m9r7"
      message: 'Сформируй краткий и структурированный дайджест для оператора техподдержки по следующим просроченным тикетам: \(.tickets)'
      auto_approve: true
      output: '\({"digest": (.Result // "")})'
      retryPolicy:
        errorList:
          - STEP_TIMEOUT
          - HTTP_CALL_500
          - HTTP_CALL_502
          - HTTP_CALL_503
          - HTTP_CALL_504
        retryCount: 3
        initialDelay: 2s
        backoffRate: 2.0
      next: escalateTickets

  # 4. Запрос к YDB: обновляем статус просроченных тикетов на 'escalated'.
  # output: '\({})' — явно ничего не добавляем в состояние, чтобы сырой
  # ответ databaseQuery не затёр ключ "digest", собранный на шаге выше
  # (слияние состояния идёт по верхнеуровневым ключам).
  escalateTickets:
    databaseQuery:
      connection:
        type: YDB
        host: ydb.serverless.yandexcloud.net
        port: 2135
        database: /ru-central1/b1guflsc731o3ndn2nkj/etne19ghdce1rb457cak  # <- заменить на свой YDB_DATABASE
        ssl: true
        iam: true
      query: >
        UPDATE tickets 
        SET status = 'escalated', updated_at = CurrentUtcTimestamp()
        WHERE status IN ('open', 'answered') 
          AND created_at < (CurrentUtcTimestamp() - Interval('PT24H'));
      mode: QUERY
      output: '\({})'
      retryPolicy:
        errorList:
          - STEP_TIMEOUT
          - YDB_CALL_SERVICE_UNAVAILABLE
        retryCount: 3
        initialDelay: 2s
        backoffRate: 2.0
      next: sendEmail

  # 5. Отправка письма оператору через CF email-sender.
  # Фолбэк — не пустая строка (сбой не должен маскироваться под успех),
  # а явное сообщение об ошибке, которое видно прямо в письме.
  sendEmail:
    httpCall:
      url: "https://functions.yandexcloud.net/d4e58dg5b5hlls5tv8g7"  # <- заменить на http_invoke_url своей CF email-sender
      method: POST
      headers:
        Content-Type: "application/json"
      body: |-
        \({
          "to": "ibitsa7@yandex.ru",
          "subject": "Дайджест просроченных тикетов",
          "body": (.digest // "⚠️ Не удалось получить текст дайджеста от агента (пустой ответ). Проверьте тикеты вручную.")
        } | tojson)
      retryPolicy:
        errorList:
          - STEP_TIMEOUT
          - HTTP_CALL_500
          - HTTP_CALL_502
          - HTTP_CALL_503
          - HTTP_CALL_504
          - HTTP_CALL_429
        retryCount: 3
        initialDelay: 2s
        backoffRate: 2.0
      next: done

  # Терминальные шаги
  noActionNeeded:
    success: {}

  done:
    success: {}
